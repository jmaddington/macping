name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  commitlint:
    name: Commit Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
      - run: npm install --no-save @commitlint/cli@21.2.4 @commitlint/config-conventional@21.2.4
      - name: Validate current commit (last commit) with commitlint
        if: github.event_name == 'push'
        run: npx commitlint --last --verbose
      - name: Validate PR commits with commitlint
        if: github.event_name == 'pull_request'
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  lint:
    name: Lint
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint
        run: swiftlint lint --strict

  build:
    name: Build
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6

      - name: Build
        run: |
          xcodebuild -project MacPing.xcodeproj \
            -scheme MacPing \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

  release:
    name: Release
    runs-on: macos-26
    needs: [commitlint, lint, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm install --no-save semantic-release@26.0.1 @semantic-release/changelog@7.0.0 @semantic-release/git@11.0.1 @semantic-release/exec@7.1.0
      - name: Install create-dmg
        run: brew install create-dmg
      # AIDEV-NOTE: build-release.sh refuses to run on CI without these; a release is always signed + notarized.
      # AIDEV-NOTE: npm deps are version-pinned because semantic-release runs while the signing keychain is unlocked.
      - name: Import signing certificate and notary key
        env:
          DEVELOPER_ID_APP_P12: ${{ secrets.DEVELOPER_ID_APP_P12 }}
          DEVELOPER_ID_APP_PASSWORD: ${{ secrets.DEVELOPER_ID_APP_PASSWORD }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: scripts/ci/import-certs.sh
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
      # AIDEV-NOTE: separate step so the Sparkle key is never in the env of npm/semantic-release code.
      # appcast.xml joins the release that semantic-release just published; SUFeedURL reads it via releases/latest.
      - name: Sparkle appcast
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ ! -f release/VERSION ]]; then echo "No release this run"; exit 0; fi
          V=$(cat release/VERSION)
          ./scripts/make-appcast.sh "release/MacPing-$V.dmg"
          gh release upload "v$V" release/appcast.xml --clobber
      - name: Clean up keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/macping-signing.keychain-db" || true; rm -f "$RUNNER_TEMP/AuthKey.p8"
