name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  commitlint:
    name: Commit Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
      - run: npm install --no-save @commitlint/cli@21.2.4 @commitlint/config-conventional@21.2.4
      - name: Validate current commit (last commit) with commitlint
        if: github.event_name == 'push'
        run: npx commitlint --last --verbose
      - name: Validate PR commits with commitlint
        if: github.event_name == 'pull_request'
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  lint:
    name: Lint
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint
        run: swiftlint lint --strict

  build:
    name: Build
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6

      - name: Build
        run: |
          xcodebuild -project MacPing.xcodeproj \
            -scheme MacPing \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

  release:
    name: Release
    runs-on: macos-26
    timeout-minutes: 90
    needs: [commitlint, lint, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      version: ${{ steps.rel.outputs.version }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm install --no-save semantic-release@26.0.1 @semantic-release/changelog@7.0.0 @semantic-release/git@11.0.1 @semantic-release/exec@7.1.0
      - name: Install create-dmg
        run: brew install create-dmg
      # Fetch Sparkle while no signing key is loaded; build-release.sh then reuses build/SourcePackages.
      - name: Resolve Swift packages
        timeout-minutes: 5
        run: xcodebuild -project MacPing.xcodeproj -scheme MacPing -derivedDataPath build -resolvePackageDependencies
      # AIDEV-NOTE: build-release.sh refuses to run on CI without these; a release is always signed + notarized.
      # AIDEV-NOTE: npm deps are version-pinned because semantic-release runs while the signing keychain is unlocked.
      - name: Import signing certificate and notary key
        env:
          DEVELOPER_ID_APP_P12: ${{ secrets.DEVELOPER_ID_APP_P12 }}
          DEVELOPER_ID_APP_PASSWORD: ${{ secrets.DEVELOPER_ID_APP_PASSWORD }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: scripts/ci/import-certs.sh
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
      - name: Stage release for appcast job
        id: rel
        run: |
          if [[ -f release/VERSION ]]; then echo "version=$(cat release/VERSION)" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/upload-artifact@v5
        if: steps.rel.outputs.version != ''
        with:
          name: release-dmg
          path: |
            release/MacPing-*.dmg
            build/Build/Products/Release/MacPing.app/Contents/Info.plist
          retention-days: 3
      - name: Clean up keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/macping-signing.keychain-db" || true; rm -f "$RUNNER_TEMP/AuthKey.p8"

  # AIDEV-NOTE: own job on a fresh runner + checkout, no npm: code from the semantic-release job can't
  # persist into the one step that holds the Sparkle key. It only receives the DMG + Info.plist.
  appcast:
    name: Sparkle appcast
    runs-on: macos-26
    needs: release
    if: needs.release.outputs.version != ''
    permissions:
      contents: write
    env:
      V: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v5
        with:
          name: release-dmg
          path: .
      - name: Verify DMG is ours and notarized
        run: |
          [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::bad version '$V'"; exit 1; }
          DMG="release/MacPing-$V.dmg"
          codesign --verify --strict "$DMG"
          codesign -dv "$DMG" 2>&1 | grep -q '^TeamIdentifier=9922U2YSY3$' || { echo "::error::DMG not signed by team 9922U2YSY3"; exit 1; }
          xcrun stapler validate "$DMG"
      - name: Sign update and publish appcast
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/make-appcast.sh "release/MacPing-$V.dmg"
          gh release upload "v$V" release/appcast.xml --clobber -R "$GITHUB_REPOSITORY"
      - name: Remove Sparkle tools
        if: always()
        run: rm -rf build/sparkle-tools
